<!DOCTYPE html>
<!-- INTENCIONALMENTE INSEGURO — NÃO PUBLICAR -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — Sistema Vulnerável</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-pagina="cadastro">
  <header class="cabecalho">
    <h1>Sistema Vulnerável</h1>
    <span class="aviso">INTENCIONALMENTE INSEGURO — NÃO PUBLICAR</span>
  </header>
  <main>
    <h2>Criar conta</h2>
    <form id="form-cadastro">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" autocomplete="name" required />
      <label for="email">E-mail</label>
      <input id="email" name="email" type="text" autocomplete="email" required />
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="new-password" required />
      <label for="cpf">CPF (fictício, só números)</label>
      <input id="cpf" name="cpf" type="text" inputmode="numeric" required />
      <button type="submit">Cadastrar</button>
    </form>
    <p id="mensagem" class="mensagem"></p>
    <p class="link">Já tem conta? <a href="login.html">Entrar</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
